name: Claude Code Review

# Review every pull request opened by a collaborator. Runs on PRs only.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; review starts when the PR is marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Public repo: never act on fork PRs (untrusted content); bots are not allowed (default).
          allow_fork_prs: "false"
          # Official code-review plugin: parallel review agents, confidence-scored findings,
          # CLAUDE.md compliance. With --comment it always posts (inline comments per issue,
          # or a "No issues found" summary). It skips PRs it has already reviewed.
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
