name: Build and Test

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'

env:
  # uv version used by CI; kept current by Renovate. Pinned so CI resolves and builds like the lockfile was made.
  UV_VERSION: '0.13.9'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      # Make uv use the interpreter under test instead of picking its own
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: ${{ env.UV_VERSION }}

    - name: Install dependencies
      run: |
        uv sync --all-groups --locked
    
    - name: Run linting
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check (ty)
      # [tool.ty] pins python-version to the 3.11 floor and covers src, tests and examples.
      if: matrix.python-version == '3.13'
      run: |
        uv run ty check --output-format github

    - name: Type check (pyright)
      # pythonVersion in [tool.pyright] pins the check to the 3.11 floor, so one run suffices.
      # tests/typing holds assert_type checks for the public API.
      if: matrix.python-version == '3.13'
      run: |
        npx --yes pyright@1.1.414 src tests/typing

    - name: Run all tests (except performance) with coverage
      run: |
        # The default pytest configuration excludes performance tests
        uv run pytest -v --tb=short --cov=src/psycopg_toolkit --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: descoped/psycopg-toolkit
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: ${{ env.UV_VERSION }}

    - name: Build package
      run: |
        uv build
        
    - name: Verify package
      run: |
        # Check that the wheel was built
        ls -la dist/
        # Verify the package structure
        uv run --no-project python -m zipfile -l dist/*.whl | head -20
        # PEP 561: without py.typed, type checkers ignore the package's annotations
        uv run --no-project python -m zipfile -l dist/*.whl | grep -q 'psycopg_toolkit/py.typed'
        # Editor settings must not ship in the sdist
        ! tar tzf dist/*.tar.gz | grep -q '\.vscode/'
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 7