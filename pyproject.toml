[project]
name = "psycopg-toolkit"
version = "0.5.1"
description = "A Python PostgreSQL database utility with connection pooling"
authors = [
    { name = "Ove Ranheim", email = "oranheim@gmail.com" }
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = ["postgresql", "database", "async", "pool", "psycopg", "jsonb", "repository-pattern", "pgvector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
]
dependencies = [
    "psycopg>=3.3.9",
    "psycopg-pool>=3.3.3",
    "tenacity>=9.2.1",
    "pydantic>=2.14.4",
]

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.15.0",
]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psycopg_toolkit"]

[tool.hatch.build]
exclude = [
    "docs/*",
    "examples/*",
    "tests/*",
    ".github/*",
    "scripts/*",
    "ai_docs/*",
    "*.gif",
    "*.png",
    "dist/*",
    "build/*",
    ".pytest_cache",
    "__pycache__",
    "*.pyc",
    ".coverage",
    "htmlcov/*",
    ".ruff_cache/*",
    ".venv/*",
    ".env",
    "*.egg-info/",
    ".claude/*",
    ".vscode/*",
    "uv.lock",
]

[project.urls]
Homepage = "https://github.com/descoped/psycopg-toolkit"
Repository = "https://github.com/descoped/psycopg-toolkit"
Documentation = "https://github.com/descoped/psycopg-toolkit/tree/master/docs"
Issues = "https://github.com/descoped/psycopg-toolkit/issues"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[tool.uv]
# Keep the dev/test environment lean. charset-normalizer (1.3 MB) is pulled in by
# requests via docker/testcontainers, but requests treats it as optional and the
# Docker API client only decodes JSON, so character-set detection is never used.
exclude-dependencies = ["charset-normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async",
    "performance: mark test as performance benchmark",
]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "-m", "not performance",  # Exclude performance tests by default
]
filterwarnings = [
    # charset-normalizer is excluded on purpose (see [tool.uv]); requests warns once on import
    "ignore:Unable to find acceptable character detection dependency:Warning:requests",
]

[tool.coverage.run]
source = ["src/psycopg_toolkit"]
branch = true
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    # Protocol method bodies (`...`) never run
    "^\\s*\\.\\.\\.$",
]
precision = 2
show_missing = true
skip_covered = false

[tool.pyright]
# Used by the pyright language server (editor / Claude Code LSP) and the `pyright` CLI.
# uv creates the project environment as `.venv` next to this file (`uv sync`, or on first
# `uv run`). Pyright does not discover it on its own: without venvPath/venv it falls back to
# whatever `python` is on PATH. The path is relative and fixed by uv, so it is the same for
# every checkout and safe to commit.
venvPath = "."
venv = ".venv"
# Same scope as the CI gate. ty checks tests and examples strictly ([tool.ty] below).
include = ["src", "tests/typing"]
# Check against the lowest supported Python so newer-only syntax is caught.
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ty]
# Astral's type checker: `uv run ty check` (a dev dependency, so the version is locked and
# Renovate tracks it). Defaults that already fit and are therefore not set here:
# - Python version: the minimum of project.requires-python (3.11).
# - Environment: VIRTUAL_ENV under `uv run`, else `.venv` next to this file.
# - First-party code: `src/` is found automatically.
# - Any diagnostic, warnings included, fails the run (terminal.error-on-warning = true).
#
# This is a published library with a typed API (py.typed), so it is checked strictly.
# Suppress a single line with `# ty: ignore[<rule>]` and a comment saying why; never a bare
# `ty: ignore`, and nothing per directory except deliberate wrong-type usage in tests.

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.analysis]
# Only `ty: ignore` silences ty. The `type: ignore[...]` comments here carry pyright/mypy
# codes and must not hide ty diagnostics.
respect-type-ignore-comments = false
# Infer return types of unannotated functions (fixtures, test helpers, examples) instead of
# treating them as Unknown, so their callers are checked too.
return-type-inference = "always"

[tool.ty.rules]
# Opt-in rules that hold for this code base. tests/typing marks errors that MUST occur with
# ty: ignore comments, so an unused one fails.
unused-ignore-comment = "error"
possibly-unresolved-reference = "error"
unsound-return = "error"
redundant-condition-strict = "error"
# pyright cannot infer AsyncConnectionPool's type parameter and needs the cast in
# Database.create_pool; ty can, and would otherwise flag it.
redundant-cast = "ignore"

[[tool.ty.overrides]]
# Tests pass wrong types on purpose (invalid modes, None connections, non-Pydantic classes),
# and the JSONB test models use `id: int | None` for SERIAL keys that are set after insert.
include = ["tests/**"]
exclude = ["tests/typing/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "C90", # mccabe complexity
    "PTH", # flake8-use-pathlib
    "TC",  # flake8-type-checking (formerly TCH)
]
ignore =[
    "E501",   # Line too long (handled by formatter)
    "N818",   # Exception name should be named with an Error suffix (backwards compatibility)
]
# Your existing ignores + a few additions
extend-ignore = [
    "S101", # Assert statements (tests need them)
    "S608", # SQL injection (psycopg handles this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B017",   # Assert raises on Exception - sometimes needed for testing
    "C901", # Allow complex functions
    "S101", # Allow assert statements
    "S106", # Allow hardcoded passwords in test fixtures
    "S105", # Allow hardcoded secrets in tests
    "T201",   # Print found (allow print statements)
]
"src/psycopg_toolkit/repositories/base.py" = [
    "C901", # _postprocess_data handles multiple concerns (date/JSON processing)
]
"examples/*" = [
    "T201", # Allow print statements in examples
    "T203", # Allow pprint in examples
    "S106", # Allow hardcoded passwords in examples
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true  # For Pydantic

[tool.ruff.lint.pep8-naming]
ignore-names = ["model_*"]  # For Pydantic models

[tool.ruff.format]
# ruff 0.16+ formats Python code blocks in Markdown by default; our docs contain
# illustrative fragments, not runnable modules, so keep the formatter on .py files.
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
